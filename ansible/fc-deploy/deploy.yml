---
# Deploy the flight-controller systemd units (sdc-fc + marker-mission)
# and select which one is the active service. The two are mutually
# exclusive (Conflicts= in each unit file) — exactly one is enabled
# + started; the other is disabled + stopped.
#
# Usage:
#   # Roll out + start marker-mission (combined Flask app)
#   ansible-playbook -i inventory.ini deploy.yml \
#       -e "target=flightctrl2 mode=marker-mission"
#
#   # Roll out + start sdc-fc (HTTP-only, legacy)
#   ansible-playbook -i inventory.ini deploy.yml \
#       -e "target=flightctrl2 mode=fc"
#
#   # Just install the units, leave both stopped (staging / dry run)
#   ansible-playbook -i inventory.ini deploy.yml \
#       -e "target=flightctrl2 mode=none"
#
# What it does:
#   1. Pulls origin/main on the host's sdc-tobe checkout so the unit
#      files + start scripts in the repo match what's installed.
#   2. Installs both unit files to /etc/systemd/system/ (idempotent).
#   3. systemctl daemon-reload.
#   4. Picks ONE of (fc, marker-mission, none):
#        - Disables + stops the unselected unit (no-op if already off).
#        - Enables + (re)starts the selected unit.
#   5. Probes the selected unit's HTTP port to confirm it's serving.

- name: Deploy SDC flight-controller systemd units
  hosts: "{{ target | default('flightctrl') }}"
  gather_facts: false
  become: true

  vars:
    repo: /home/sdc/sdc-tobe
    branch: main
    mode: marker-mission   # default if not passed on the CLI
    unit_dir: /etc/systemd/system
    fc_unit: sdc-fc.service
    mm_unit: marker-mission.service
    # Default listening port for both units. unified_api_server reads
    # HTTP_PORT from env (default 8080); marker_mission's combined app
    # reads MissionConfig.ui_port (default 8080). The two units are
    # mutually exclusive, so sharing the port is fine — only one ever
    # binds. For marker-mission the playbook still reads MissionConfig
    # on the host below to honour per-host overrides (operators tune
    # the port via the /tune page) before falling back to this value.
    fc_port: 8080
    mm_port_default: 8080

  pre_tasks:
    - name: Validate mode
      ansible.builtin.fail:
        msg: "mode must be one of: fc, marker-mission, none (got '{{ mode }}')"
      when: mode not in ['fc', 'marker-mission', 'none']

    - name: Show plan
      ansible.builtin.debug:
        msg:
          - "Host          : {{ inventory_hostname }}"
          - "Repo          : {{ repo }}@{{ branch }}"
          - "Mode          : {{ mode }}"
          - "Will enable   : {{ {'fc': fc_unit, 'marker-mission': mm_unit, 'none': '(none)'}[mode] }}"
          - "Will disable  : {{ {'fc': mm_unit, 'marker-mission': fc_unit, 'none': 'both'}[mode] }}"

    # Catch hand-started python processes that own a port the new
    # service needs to bind. Without this the deploy "succeeds" but
    # the squatter keeps serving (this bit us on flightctrl2: a
    # 4-hour-old `python unified_api_server.py` was on :8080, an
    # equally-old `python -m marker_mission.mission --ui-port 8090`
    # was on :8090, and our marker-mission.service silently failed
    # to bind 8090 — the probe found the squatter and went green).
    - name: Detect non-systemd python on ports 5050/8080/8090
      ansible.builtin.shell: |
        for p in 5050 8080 8090; do
          pids=$(ss -tlnp 2>/dev/null | awk -v port=":$p" '$0 ~ port {match($0,/pid=([0-9]+)/,m); print m[1]}' | sort -u)
          for pid in $pids; do
            unit=$(systemctl status "$pid" 2>/dev/null \
                   | awk -F'─' '/●/{print $NF}' | head -1)
            cmd=$(ps -p "$pid" -o cmd= 2>/dev/null)
            if [ -z "$unit" ]; then
              echo "STRAY pid=$pid port=$p cmd=$cmd"
            fi
          done
        done
      register: stray_check
      changed_when: false
      become: true

    - name: Fail if non-systemd python is squatting our ports
      ansible.builtin.fail:
        msg: |
          Found python process(es) holding deploy ports that are NOT
          managed by systemd. Stop them by hand before re-running, e.g.
            sudo kill -INT <pid>
          Then re-run this playbook. Details:
          {{ stray_check.stdout }}
      when:
        - stray_check.stdout is defined
        - stray_check.stdout | length > 0

  tasks:
    # ── 1. Repo sync ────────────────────────────────────────────────
    - name: Stat repo
      ansible.builtin.stat:
        path: "{{ repo }}/.git"
      register: repo_git
      become: false

    - name: Fail if repo missing
      ansible.builtin.fail:
        msg: |
          {{ repo }} is not a git checkout on {{ inventory_hostname }}.
          Clone it first:
            sudo -u sdc git clone https://github.com/otiedemann/sdc-tobe.git {{ repo }}
      when: not repo_git.stat.exists

    - name: Pull latest on the host repo
      ansible.builtin.shell: |
        set -e
        cd {{ repo }}
        git fetch --prune origin {{ branch }}
        git checkout {{ branch }} 2>/dev/null || true
        git reset --hard origin/{{ branch }}
        git log -1 --oneline
      register: git_pull
      changed_when: "'Already up to date' not in git_pull.stdout"
      become: true
      become_user: sdc

    - name: Show resulting HEAD
      ansible.builtin.debug:
        var: git_pull.stdout_lines

    # ── 2. Install unit files (idempotent — Ansible's `copy` only
    #      restarts/notifies on actual content change) ──────────────
    - name: Install sdc-fc.service
      ansible.builtin.copy:
        src: "{{ repo }}/controller_unified/systemd/sdc-fc.service"
        dest: "{{ unit_dir }}/{{ fc_unit }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      notify: daemon-reload

    - name: Install marker-mission.service
      ansible.builtin.copy:
        src: "{{ repo }}/marker_mission/systemd/marker-mission.service"
        dest: "{{ unit_dir }}/{{ mm_unit }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      notify: daemon-reload

    - name: Ensure start scripts are executable
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0755"
      loop:
        - "{{ repo }}/controller_unified/systemd/sdc-fc-start.sh"
        - "{{ repo }}/controller_unified/systemd/sdc-fc-update.sh"
        - "{{ repo }}/marker_mission/systemd/marker-mission-start.sh"
      become: true
      become_user: sdc

    - name: Flush handlers so daemon-reload runs before enable/start below
      ansible.builtin.meta: flush_handlers

    # ── 3. Switch active unit ──────────────────────────────────────
    # ORDER MATTERS: stop+disable the loser FIRST so the winner can
    # bind ports cleanly. Conflicts= in the unit files would also
    # handle this, but doing it explicitly here makes the playbook
    # output legible.

    - name: Disable + stop sdc-fc (loser when mode != fc)
      ansible.builtin.systemd:
        name: "{{ fc_unit }}"
        enabled: false
        state: stopped
      when: mode != 'fc'
      register: fc_stop
      failed_when:
        - fc_stop.failed | default(false)
        - "'not loaded' not in (fc_stop.msg | default(''))"

    - name: Disable + stop marker-mission (loser when mode != marker-mission)
      ansible.builtin.systemd:
        name: "{{ mm_unit }}"
        enabled: false
        state: stopped
      when: mode != 'marker-mission'
      register: mm_stop
      failed_when:
        - mm_stop.failed | default(false)
        - "'not loaded' not in (mm_stop.msg | default(''))"

    - name: Enable + start sdc-fc
      ansible.builtin.systemd:
        name: "{{ fc_unit }}"
        enabled: true
        state: started
      when: mode == 'fc'

    - name: Enable + (re)start marker-mission
      ansible.builtin.systemd:
        name: "{{ mm_unit }}"
        enabled: true
        # `restarted` rather than `started` so a unit-file content
        # change from step 2 actually takes effect even when the
        # daemon was already running on the old definition.
        state: restarted
      when: mode == 'marker-mission'

    # ── 4. Post-deploy health probe ────────────────────────────────
    # Resolve the actual mission UI port from MissionConfig on the
    # host (default 8080, but operators commonly save per-host
    # overrides via the /tune page). For fc mode there's no per-host
    # state so we use the deployment-wide default (8080).
    - name: Read MissionConfig.ui_port from host (marker-mission mode)
      ansible.builtin.slurp:
        src: /home/sdc/.marker_mission/config.json
      register: mm_cfg_slurp
      when: mode == 'marker-mission'
      ignore_errors: true

    - name: Resolve probe port (marker-mission, from MissionConfig)
      ansible.builtin.set_fact:
        probe_port: "{{ (mm_cfg_slurp.content | b64decode | from_json).ui_port }}"
      when:
        - mode == 'marker-mission'
        - mm_cfg_slurp is defined
        - mm_cfg_slurp.content is defined

    - name: Resolve probe port (fallback)
      ansible.builtin.set_fact:
        probe_port: "{{ fc_port if mode == 'fc' else mm_port_default }}"
      when: probe_port is not defined

    - name: Show resolved probe port
      ansible.builtin.debug:
        msg: "Probing port {{ probe_port }} (mode={{ mode }})"
      when: mode in ['fc', 'marker-mission']

    - name: Wait for selected service to bind its port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ probe_port }}"
        timeout: 30
      when: mode in ['fc', 'marker-mission']

    - name: Probe /api/telemetry
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ probe_port }}/api/telemetry"
        return_content: true
        status_code: 200
      when: mode in ['fc', 'marker-mission']
      register: telemetry_probe

    - name: Probe /mission (marker-mission only — confirms UI routes attached)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ probe_port }}/mission"
        status_code: 200
      when: mode == 'marker-mission'
      register: mission_ui_probe

    - name: Deploy complete
      ansible.builtin.debug:
        msg:
          - "✓ Deploy done on {{ inventory_hostname }}"
          - "  Mode               : {{ mode }}"
          - "  HEAD               : {{ git_pull.stdout_lines | last }}"
          - "  Probed port        : {{ probe_port | default('n/a') }}"
          - "  /api/telemetry     : {{ (telemetry_probe.status | default('skipped')) }}"
          - "  Telemetry connected: {{ (telemetry_probe.json.connected | default('n/a')) if mode != 'none' else 'n/a' }}"
          - "  /mission (UI)      : {{ (mission_ui_probe.status | default('skipped')) }}"

  handlers:
    - name: daemon-reload
      ansible.builtin.systemd:
        daemon_reload: true
