; Ansible inventory for the flight-controller (FC) host fleet. Each
; host runs ONE of (sdc-fc.service, marker-mission.service) at a time —
; both units conflict via systemd's Conflicts= directive.
;
; Run the deploy playbook against a single host with:
;
;   ansible-playbook -i inventory.ini deploy.yml \
;       -e "target=flightctrl2 mode=marker-mission"
;
; modes: fc | marker-mission | none
;   fc              — enable + start sdc-fc.service (HTTP-only on :5050)
;   marker-mission  — enable + start marker-mission.service (combined
;                     app, mission UI + unified routes on one port)
;   none            — install unit files but leave both stopped /
;                     disabled (useful for staging before a switchover)

[flightctrl]
flightctrl1   ansible_user=sdc
flightctrl2   ansible_user=sdc
flightctrl3   ansible_user=sdc
flightctrl4   ansible_user=sdc
flightctrl5   ansible_user=sdc
flightctrl6   ansible_user=sdc

[all:vars]
ansible_python_interpreter=/usr/bin/python3
; SSH password auth is the SDC fleet convention. Either:
;   - run with --ask-pass --ask-become-pass, or
;   - export ANSIBLE_BECOME_PASSWORD / ANSIBLE_SSH_PASS, or
;   - rely on agent-forwarded keys (BatchMode-safe on flightctrl{1..6})
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
