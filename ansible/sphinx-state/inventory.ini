# Ansible inventory for sphinx-state backup/restore.
#
# 'source' = the host you want to BACKUP (current production sim host).
# 'target' = the host you want to RESTORE onto.
#
# Override per-run from the CLI:
#   ansible-playbook -i inventory.ini backup.yml \
#       -e "source_host=sphinx.otconsulting.de"
#   ansible-playbook -i inventory.ini restore.yml \
#       -e "target_host=newbox.example.com archive=backups/sphinx-2026-05-05.tar.gz"

[source]
sphinx.otconsulting.de  ansible_user=sdc

[target]
# Add the destination host here, e.g.:
# newsim.example.com  ansible_user=sdc

[all:vars]
ansible_python_interpreter=/usr/bin/python3
# SSH password auth used on the SDC fleet. Either:
#   - export ANSIBLE_BECOME_PASSWORD / ANSIBLE_SSH_PASS, or
#   - run with --ask-pass --ask-become-pass, or
#   - use 'sshpass -p sdc26 ansible-playbook ...'
ansible_ssh_common_args=-o StrictHostKeyChecking=no
