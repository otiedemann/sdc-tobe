<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drone Telemetry 3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  #ui {
    position: absolute; top: 0; left: 0; z-index: 10; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  }
  #ui > * { pointer-events: auto; }
  h1 { font-size: 18px; font-weight: 600; color: #38bdf8; }
  .panel {
    background: rgba(15,23,42,0.92); border: 1px solid #1e293b;
    border-radius: 8px; padding: 12px; max-width: 340px;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .row label { font-size: 12px; color: #94a3b8; min-width: 50px; }
  .row span { font-size: 13px; font-family: monospace; color: #e2e8f0; }
  button {
    background: #1e3a5f; border: 1px solid #38bdf8; color: #38bdf8;
    padding: 5px 14px; border-radius: 5px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #1e4a7f; }
  input[type=range] { flex: 1; accent-color: #38bdf8; }
  input[type=file] { font-size: 12px; color: #94a3b8; }
  #info { font-size: 11px; color: #64748b; }
  #timeline { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; align-items: center; gap: 10px;
    background: rgba(15,23,42,0.92); border: 1px solid #1e293b;
    border-radius: 8px; padding: 10px 20px; width: 80%; max-width: 700px;
  }
  #timeline input { flex: 1; }
  #timeline span { font-size: 12px; font-family: monospace; color: #94a3b8; min-width: 48px; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="ui">
  <h1>Drone Telemetry 3D Viewer</h1>
  <div class="panel">
    <input type="file" id="fileInput" accept=".jsonl,.json,.txt" />
    <div id="info">Drop or select a telemetry .jsonl file</div>
  </div>
  <div class="panel" id="telPanel" style="display:none;">
    <div class="row"><label>Time</label><span id="v_time">-</span></div>
    <div class="row"><label>Pos</label><span id="v_pos">-</span></div>
    <div class="row"><label>Height</label><span id="v_h">-</span></div>
    <div class="row"><label>Speed</label><span id="v_spd">-</span></div>
    <div class="row"><label>Yaw</label><span id="v_yaw">-</span></div>
    <div class="row"><label>Battery</label><span id="v_bat">-</span></div>
    <div class="row"><label>Flying</label><span id="v_fly">-</span></div>
    <div class="row">
      <button id="btnPlay">Play</button>
      <label style="min-width:auto;">Speed</label>
      <input type="range" id="playSpeed" min="0.1" max="5" step="0.1" value="1" style="width:80px;" />
      <span id="playSpeedVal">1.0x</span>
    </div>
    <div class="row">
      <label>Trail</label>
      <input type="range" id="trailOpacity" min="0" max="100" step="5" value="80" style="width:100px;" />
    </div>
  </div>
</div>
<div id="timeline" style="display:none;">
  <span id="tl_cur">0.0s</span>
  <input type="range" id="scrubber" min="0" max="100" step="1" value="0" />
  <span id="tl_end">0.0s</span>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Scene setup ──────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 200);
camera.position.set(3, 2.5, 3);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Ambient + directional light
scene.add(new THREE.AmbientLight(0x334466, 1.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.6);
dl.position.set(5, 8, 3);
scene.add(dl);

// ── State ────────────────────────────────────────────────────────────────────
let frames = [];       // parsed telemetry frames
let positions = [];    // integrated [x, y, z] in metres
let times = [];        // seconds since start
let currentIdx = 0;
let playing = false;
let playStart = 0;
let playTimeOffset = 0;

// 3D objects
let trailLine = null;
let trailPoints = [];
let droneGroup = null;
let heightLine = null;
let gridGroup = null;

// ── File loading ─────────────────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => loadData(ev.target.result);
  reader.readAsText(file);
});

// Also support drag-drop on body
document.body.addEventListener('dragover', (e) => { e.preventDefault(); });
document.body.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => loadData(ev.target.result);
  reader.readAsText(file);
});

function loadData(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  frames = lines.map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
  if (frames.length < 2) { document.getElementById('info').textContent = 'Need at least 2 data points'; return; }

  // Integrate velocity to get position (velocity is in cm/s)
  const t0 = frames[0].updated_at;
  times = frames.map(f => f.updated_at - t0);
  positions = [];
  let px = 0, py = 0;
  for (let i = 0; i < frames.length; i++) {
    const f = frames[i];
    const h = (f.height_cm || 0) / 100.0; // metres
    if (i > 0) {
      const dt = times[i] - times[i - 1];
      // vgx = forward (body frame), vgy = lateral (body frame)
      // Rotate by yaw to get world-frame displacement
      const yawRad = (f.yaw || 0) * Math.PI / 180;
      const vx = f.vgx || 0; // cm/s
      const vy = f.vgy || 0;
      // world X = forward * cos(yaw) - lateral * sin(yaw)
      // world Y = forward * sin(yaw) + lateral * cos(yaw)
      px += (vx * Math.cos(yawRad) - vy * Math.sin(yawRad)) * dt / 100.0;
      py += (vx * Math.sin(yawRad) + vy * Math.cos(yawRad)) * dt / 100.0;
    }
    positions.push([px, h, py]); // Three.js: Y=up
  }

  document.getElementById('info').textContent =
    `${frames.length} frames, ${times[times.length-1].toFixed(1)}s duration`;

  buildScene();
  currentIdx = 0;
  updateUI(0);
  document.getElementById('telPanel').style.display = '';
  document.getElementById('timeline').style.display = '';
  document.getElementById('scrubber').max = frames.length - 1;
  document.getElementById('tl_end').textContent = times[times.length-1].toFixed(1) + 's';
}

// ── Build 3D scene ───────────────────────────────────────────────────────────
function buildScene() {
  // Remove old objects
  if (trailLine) scene.remove(trailLine);
  if (droneGroup) scene.remove(droneGroup);
  if (heightLine) scene.remove(heightLine);
  if (gridGroup) scene.remove(gridGroup);

  // Compute bounding box for grid sizing
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity, maxY = 0;
  for (const p of positions) {
    minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
    minZ = Math.min(minZ, p[2]); maxZ = Math.max(maxZ, p[2]);
    maxY = Math.max(maxY, p[1]);
  }
  const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
  const spanX = Math.max(1, maxX - minX + 1);
  const spanZ = Math.max(1, maxZ - minZ + 1);
  const gridSize = Math.ceil(Math.max(spanX, spanZ, maxY + 0.5) * 1.3);

  // Grid floor
  gridGroup = new THREE.Group();
  const gridMat = new THREE.LineBasicMaterial({ color: 0x1e3a5f, transparent: true, opacity: 0.5 });
  const step = gridSize <= 4 ? 0.5 : 1.0;
  const halfG = Math.ceil(gridSize / 2 / step) * step;
  for (let v = -halfG; v <= halfG + 0.001; v += step) {
    const g1 = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(cx + v, 0, cz - halfG), new THREE.Vector3(cx + v, 0, cz + halfG)]);
    gridGroup.add(new THREE.Line(g1, gridMat));
    const g2 = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(cx - halfG, 0, cz + v), new THREE.Vector3(cx + halfG, 0, cz + v)]);
    gridGroup.add(new THREE.Line(g2, gridMat));
  }

  // Vertical grid (height ruler) on side
  const hGridMat = new THREE.LineBasicMaterial({ color: 0x1e3a5f, transparent: true, opacity: 0.3 });
  for (let h = 0; h <= Math.ceil(maxY + 0.5); h += step) {
    const hg = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(cx - halfG, h, cz - halfG), new THREE.Vector3(cx + halfG, h, cz - halfG)]);
    gridGroup.add(new THREE.Line(hg, hGridMat));
    const hg2 = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(cx - halfG, h, cz - halfG), new THREE.Vector3(cx - halfG, h, cz + halfG)]);
    gridGroup.add(new THREE.Line(hg2, hGridMat));
  }

  // Axis labels as sprites
  const addLabel = (text, pos, color) => {
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 48;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = color || '#64748b';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, 64, 24);
    const tex = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
    const sp = new THREE.Sprite(mat);
    sp.position.copy(pos);
    sp.scale.set(0.6, 0.22, 1);
    gridGroup.add(sp);
  };

  // Ruler marks
  for (let v = -halfG; v <= halfG + 0.001; v += step) {
    if (Math.abs(v) < 0.01 && step < 1) continue;
    addLabel(v.toFixed(v % 1 === 0 ? 0 : 1) + 'm',
      new THREE.Vector3(cx + v, -0.12, cz - halfG - 0.2), '#475569');
    addLabel(v.toFixed(v % 1 === 0 ? 0 : 1) + 'm',
      new THREE.Vector3(cx - halfG - 0.3, -0.12, cz + v), '#475569');
  }
  for (let h = 0; h <= Math.ceil(maxY + 0.5); h += step) {
    addLabel(h.toFixed(h % 1 === 0 ? 0 : 1) + 'm',
      new THREE.Vector3(cx - halfG - 0.3, h, cz - halfG - 0.2), '#475569');
  }

  // Axes
  const axLen = halfG + 0.3;
  const axMat = (c) => new THREE.LineBasicMaterial({ color: c });
  const axG = (a, b) => new THREE.BufferGeometry().setFromPoints([a, b]);
  gridGroup.add(new THREE.Line(axG(new THREE.Vector3(cx - halfG, 0, cz - halfG),
    new THREE.Vector3(cx + axLen, 0, cz - halfG)), axMat(0xef4444)));
  gridGroup.add(new THREE.Line(axG(new THREE.Vector3(cx - halfG, 0, cz - halfG),
    new THREE.Vector3(cx - halfG, 0, cz + axLen)), axMat(0x22c55e)));
  gridGroup.add(new THREE.Line(axG(new THREE.Vector3(cx - halfG, 0, cz - halfG),
    new THREE.Vector3(cx - halfG, Math.ceil(maxY + 0.5) + 0.3, cz - halfG)), axMat(0x3b82f6)));
  addLabel('X', new THREE.Vector3(cx + axLen + 0.2, 0, cz - halfG), '#ef4444');
  addLabel('Y', new THREE.Vector3(cx - halfG, 0, cz + axLen + 0.2), '#22c55e');
  addLabel('H', new THREE.Vector3(cx - halfG, Math.ceil(maxY + 0.5) + 0.5, cz - halfG), '#3b82f6');

  scene.add(gridGroup);

  // Trail line (full path, semi-transparent)
  trailPoints = positions.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const trailGeo = new THREE.BufferGeometry().setFromPoints(trailPoints);
  // Color gradient: cyan -> orange based on speed
  const colors = new Float32Array(positions.length * 3);
  for (let i = 0; i < frames.length; i++) {
    const spd = (frames[i].speed || 0) / 100; // normalise
    const t = Math.min(1, spd);
    colors[i * 3] = 0.22 + t * 0.75;     // R
    colors[i * 3 + 1] = 0.74 - t * 0.35;  // G
    colors[i * 3 + 2] = 0.97 - t * 0.7;   // B
  }
  trailGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.8, linewidth: 2
  }));
  scene.add(trailLine);

  // Drone marker
  droneGroup = new THREE.Group();
  // Body sphere
  const bodyGeo = new THREE.SphereGeometry(0.06, 12, 8);
  const bodyMat = new THREE.MeshPhongMaterial({ color: 0xf97316, emissive: 0x7c2d12 });
  droneGroup.add(new THREE.Mesh(bodyGeo, bodyMat));
  // Arms (wireframe cross)
  const armMat = new THREE.LineBasicMaterial({ color: 0xfacc15 });
  const armLen = 0.12;
  for (const [dx, dz] of [[1,1],[-1,1],[1,-1],[-1,-1]]) {
    const ag = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(dx * armLen, 0, dz * armLen)]);
    droneGroup.add(new THREE.Line(ag, armMat));
    // Rotor ring
    const rg = new THREE.RingGeometry(0.025, 0.04, 12);
    const rm = new THREE.MeshBasicMaterial({ color: 0xfacc15, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
    const ring = new THREE.Mesh(rg, rm);
    ring.position.set(dx * armLen, 0.005, dz * armLen);
    ring.rotation.x = -Math.PI / 2;
    droneGroup.add(ring);
  }
  // Forward indicator
  const fwdGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -0.15)]);
  droneGroup.add(new THREE.Line(fwdGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8 })));
  scene.add(droneGroup);

  // Height reference line (vertical dashed from ground to drone)
  const hlGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1, 0)]);
  heightLine = new THREE.Line(hlGeo, new THREE.LineDashedMaterial({
    color: 0x475569, dashSize: 0.05, gapSize: 0.03 }));
  heightLine.computeLineDistances();
  scene.add(heightLine);

  // Centre camera
  controls.target.set(cx, maxY / 2, cz);
  camera.position.set(cx + gridSize * 0.8, maxY + gridSize * 0.5, cz + gridSize * 0.8);
  controls.update();
}

// ── UI updates ───────────────────────────────────────────────────────────────
const scrubber = document.getElementById('scrubber');
scrubber.addEventListener('input', () => {
  currentIdx = parseInt(scrubber.value);
  updateUI(currentIdx);
  if (playing) { playTimeOffset = times[currentIdx]; playStart = performance.now() / 1000; }
});

document.getElementById('btnPlay').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('btnPlay').textContent = playing ? 'Pause' : 'Play';
  if (playing) { playStart = performance.now() / 1000; playTimeOffset = times[currentIdx]; }
});

document.getElementById('playSpeed').addEventListener('input', (e) => {
  document.getElementById('playSpeedVal').textContent = parseFloat(e.target.value).toFixed(1) + 'x';
});

document.getElementById('trailOpacity').addEventListener('input', (e) => {
  if (trailLine) trailLine.material.opacity = parseInt(e.target.value) / 100;
});

function updateUI(idx) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, idx));
  const f = frames[idx];
  const p = positions[idx];

  document.getElementById('v_time').textContent = times[idx].toFixed(2) + 's';
  document.getElementById('v_pos').textContent =
    `X:${p[0].toFixed(2)}m  Y:${p[2].toFixed(2)}m`;
  document.getElementById('v_h').textContent = `${(f.height_cm / 100).toFixed(2)}m (${f.height_cm.toFixed(0)}cm)`;
  document.getElementById('v_spd').textContent = `${(f.speed || 0).toFixed(1)} cm/s`;
  document.getElementById('v_yaw').textContent = `${(f.yaw || 0).toFixed(1)}deg`;
  document.getElementById('v_bat').textContent = `${f.battery}%`;
  document.getElementById('v_fly').textContent = f.flying ? 'YES' : 'no';
  document.getElementById('v_fly').style.color = f.flying ? '#22c55e' : '#ef4444';

  document.getElementById('tl_cur').textContent = times[idx].toFixed(1) + 's';
  scrubber.value = idx;

  // Update 3D
  if (droneGroup) {
    droneGroup.position.set(p[0], p[1], p[2]);
    droneGroup.rotation.y = -(f.yaw || 0) * Math.PI / 180;
  }
  if (heightLine) {
    heightLine.position.set(p[0], 0, p[2]);
    heightLine.scale.y = Math.max(0.001, p[1]);
    heightLine.computeLineDistances();
  }

  // Partial trail: show only up to current index
  if (trailLine) {
    trailLine.geometry.setDrawRange(0, idx + 1);
  }
}

// ── Animation loop ───────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  if (playing && frames.length > 0) {
    const speed = parseFloat(document.getElementById('playSpeed').value);
    const elapsed = (performance.now() / 1000 - playStart) * speed + playTimeOffset;
    const maxT = times[times.length - 1];
    const t = elapsed % (maxT + 1); // loop

    // Find closest frame index
    let idx = 0;
    for (let i = 0; i < times.length; i++) {
      if (times[i] <= t) idx = i; else break;
    }
    if (idx !== currentIdx) { currentIdx = idx; updateUI(idx); }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

// Auto-load example file if provided via URL param
const urlParams = new URLSearchParams(window.location.search);
const fileParam = urlParams.get('file');
if (fileParam) {
  fetch(fileParam).then(r => r.text()).then(loadData).catch(() => {});
}
</script>
</body>
</html>
