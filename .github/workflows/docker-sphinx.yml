# Build the sdc-sphinx image natively on x86_64 GitHub-hosted runners
# and push to GHCR. Triggered manually (workflow_dispatch) or on tags
# starting with `docker-v*`.
#
# Triggered manually:
#   gh workflow run docker-sphinx.yml
# Or push a tag:
#   git tag docker-v0.1 && git push --tags
#
# After the run, the image is available at:
#   ghcr.io/<owner>/sdc-sphinx:latest
#   ghcr.io/<owner>/sdc-sphinx:<sha>
#
# Pull on a Linux/x86 host (RunPod / Lambda / your own):
#   docker pull ghcr.io/<owner>/sdc-sphinx:latest

name: Build sdc-sphinx Docker image

on:
  workflow_dispatch:
    inputs:
      prebuild_arena:
        description: "Pre-build arena assets at image build time"
        required: false
        default: "1"
  push:
    tags:
      - "docker-v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Opt into Node 24 ahead of the June 2026 deadline to silence
      # the deprecation warning on @v3/@v4 javascript actions.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMG="ghcr.io/${OWNER}/sdc-sphinx"
          echo "img=${IMG}" >> $GITHUB_OUTPUT
          echo "sha=${IMG}:${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "latest=${IMG}:latest" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.latest }}
          build-args: |
            PREBUILD_ARENA=${{ github.event.inputs.prebuild_arena || '1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
