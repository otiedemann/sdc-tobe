<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDC26 C2 — Operator Console</title>
  <link rel="stylesheet" href="/web/app.css" />
</head>
<body>
  <header>
    <div class="title">
      <h1>SDC26 <span class="accent">C2</span></h1>
      <span class="badge" id="team-badge">team —</span>
      <span class="badge" id="conn-badge" title="live-link status">offline</span>
    </div>
    <div class="header-right">
      <div class="score" id="score">
        <span class="score-us" id="score-us">0</span>
        <span class="score-sep">:</span>
        <span class="score-them" id="score-them">0</span>
      </div>
      <!-- Mode toggle: the prominent MANUAL / AUTO switch. -->
      <div class="mode-toggle" id="mode-toggle" role="group" aria-label="game mode">
        <button class="mode-btn" id="mode-manual" data-mode="manual">MANUAL</button>
        <button class="mode-btn" id="mode-auto" data-mode="auto">AUTO</button>
      </div>
    </div>
  </header>

  <main>
    <!-- 1. TARGET SLOTS — the panel the operator watches constantly. -->
    <section id="slots-section">
      <div class="section-header">
        <h2>Target Slots</h2>
        <span class="muted" id="slots-sub">6 boxes</span>
      </div>
      <div class="slots-grid" id="slots-grid">
        <!-- 6 slot tiles injected by app.js -->
      </div>
    </section>

    <div class="two-col">
      <!-- 2. DRONES. -->
      <section id="drones-section">
        <div class="section-header">
          <h2>Drones</h2>
          <span class="count" id="drone-count">0</span>
        </div>
        <div class="table-wrap">
          <table id="drones-table">
            <thead>
              <tr>
                <th>Drone</th>
                <th>Role</th>
                <th>Phase</th>
                <th>Alt (m)</th>
                <th>Link</th>
                <th>Batt</th>
                <th>Slot</th>
                <th>Note</th>
              </tr>
            </thead>
            <tbody id="drones-body">
              <tr class="empty"><td colspan="8">waiting for telemetry…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- 5. EVENT LOG. -->
      <section id="events-section">
        <div class="section-header">
          <h2>Event Log</h2>
          <span class="muted" id="events-sub">0</span>
        </div>
        <ul class="event-log" id="event-log">
          <li class="muted">no events yet</li>
        </ul>
      </section>
    </div>

    <!-- 4. MANUAL COMMAND CONSOLE. -->
    <section id="console-section">
      <div class="section-header">
        <h2>Manual Command Console</h2>
        <span class="muted" id="console-hint"></span>
      </div>

      <div class="console-grid">
        <!-- Per-drone basic commands -->
        <div class="console-card">
          <label for="drone-select">Target drone</label>
          <select id="drone-select"></select>
          <div class="btn-row">
            <button class="cmd" data-type="takeoff">Takeoff</button>
            <button class="cmd" data-type="land">Land</button>
            <button class="cmd secondary" data-type="stop">Stop</button>
            <button class="cmd secondary" data-type="return_home">Return Home</button>
            <button class="cmd secondary" data-type="scout">Scout</button>
          </div>
        </div>

        <!-- Attack -->
        <div class="console-card">
          <label>Attack slot</label>
          <div class="inline">
            <select id="attack-slot" class="slot-select"></select>
            <button class="cmd attack" id="btn-attack">Attack</button>
          </div>
          <p class="muted small">drone flies to the enemy box and captures it</p>
        </div>

        <!-- Defend -->
        <div class="console-card">
          <label>Defend (optional slot)</label>
          <div class="inline">
            <select id="defend-slot" class="slot-select">
              <option value="">— any —</option>
            </select>
            <button class="cmd defend" id="btn-defend">Defend</button>
          </div>
          <p class="muted small">patrol / un-cap one of our boxes</p>
        </div>

        <!-- Assign role -->
        <div class="console-card">
          <label>Assign role</label>
          <div class="inline">
            <select id="role-select">
              <option value="scout">scout</option>
              <option value="attacker">attacker</option>
              <option value="defender">defender</option>
              <option value="idle">idle</option>
            </select>
            <button class="cmd" id="btn-role">Assign</button>
          </div>
        </div>
      </div>

      <!-- Global / fleet-wide controls -->
      <div class="global-row">
        <span class="global-label">All drones:</span>
        <button class="cmd" data-type="takeoff" data-all="1">Takeoff all</button>
        <button class="cmd" data-type="land" data-all="1">Land all</button>
        <button class="cmd danger" data-type="emergency" data-all="1" id="btn-emergency">EMERGENCY</button>
      </div>
      <div class="toast" id="toast"></div>
    </section>
  </main>

  <script src="/web/app.js"></script>
</body>
</html>
