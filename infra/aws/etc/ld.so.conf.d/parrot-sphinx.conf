# Parrot Sphinx ships its shared libraries under /opt/parrot-sphinx/usr/lib
# (libtelemetry.so, libulog.so, libshdata.so, libgazebo.so, libcivetweb.so,
# libfutils.so, …). The official `apt install parrot-sphinx` is supposed to
# drop a conf file here so they're discoverable by the dynamic linker, but
# the SDC AMI lost it at some point (apt history shows parrot-sphinx was
# reinstalled --no-install-recommends, which can skip the linker-cache
# step). When that file is missing, pysphinx fails to import:
#
#   [SIM-VIDEO] pysphinx import failed: libtelemetry.so: cannot open shared
#   object file: No such file or directory
#
# and the FC silently falls back to a black/MJPEG-only path, so the sim
# video feed never appears in the UI.
#
# Running `sudo ldconfig` after dropping this file is enough; install.sh
# does that automatically.
/opt/parrot-sphinx/usr/lib
