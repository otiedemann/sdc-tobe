<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img">
<title>Yaw to marker, top-down view</title>
<desc>Top-down diagram showing how yaw_to_marker_deg is the signed angle between the drone's nose direction and the line from the drone to the marker centre, positive when the marker is on the camera's right.</desc>
<style>
  .ts { font: 400 12px -apple-system,"Segoe UI",sans-serif; fill: #2C2C2A; }
  .th { font: 500 14px -apple-system,"Segoe UI",sans-serif; fill: #2C2C2A; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="ts" x="240" y="30" text-anchor="middle">Top-down view (looking down from world up)</text>

<!-- Wall + marker -->
<line x1="60" y1="80" x2="420" y2="80" stroke="#5F5E5A" stroke-width="3"/>
<text class="ts" x="60" y="70">Wall</text>

<rect x="240" y="68" width="40" height="24" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="ts" x="260" y="84" text-anchor="middle" fill="#712B13">Marker</text>
<circle cx="260" cy="92" r="3" fill="#993C1D"/>

<!-- Marker outward normal (short, away from text region) -->
<line x1="260" y1="92" x2="260" y2="135" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="268" y="118" fill="#712B13">marker normal</text>

<!-- Line of sight: drone (160, 380) to marker centre (260, 92). Stop short of the marker. -->
<line x1="160" y1="380" x2="252" y2="115" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="2 3"/>
<text class="ts" x="60" y="290" fill="#0C447C">line of sight</text>
<text class="ts" x="60" y="305" fill="#0C447C">(drone → marker)</text>

<!-- Drone nose direction (pointing straight up) -->
<line x1="160" y1="380" x2="160" y2="270" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="100" y="240" fill="#085041">drone nose</text>
<text class="ts" x="100" y="255" fill="#085041">(forward)</text>

<!-- Angle arc between drone-nose (up) and line-of-sight (toward marker) -->
<path d="M 160 320 A 60 60 0 0 1 178 280" fill="none" stroke="#7F77DD" stroke-width="2"/>
<text class="th" x="195" y="312" fill="#3C3489">α</text>

<!-- Drone -->
<polygon points="160,380 150,400 170,400" fill="#0F6E56"/>
<text class="ts" x="160" y="418" text-anchor="middle">Drone</text>

<!-- Caption on the right -->
<text class="th" x="470" y="180">α  =  yaw_to_marker_deg</text>
<text class="ts" x="470" y="210">Here α &gt; 0 (the marker</text>
<text class="ts" x="470" y="226">sits on the drone's right),</text>
<text class="ts" x="470" y="242">so the controller commands</text>
<text class="ts" x="470" y="258">a positive yaw RC (clockwise</text>
<text class="ts" x="470" y="274">from above) to face it.</text>

<text class="ts" x="470" y="310">α &lt; 0 would mean the marker</text>
<text class="ts" x="470" y="326">is to the drone's left, and</text>
<text class="ts" x="470" y="342">the controller would yaw</text>
<text class="ts" x="470" y="358">counter-clockwise.</text>
</svg>
