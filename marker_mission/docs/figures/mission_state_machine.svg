<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img">
<title>Mission state machine</title>
<desc>Diagram of the mission's seven phases from takeoff to done, plus the marker-lost recovery path that returns to search and the unconditional path to land.</desc>
<style>
  .t { font: 500 14px -apple-system,"Segoe UI",sans-serif; fill: #2C2C2A; }
  .ts { font: 400 12px -apple-system,"Segoe UI",sans-serif; fill: #2C2C2A; }
  .th { font: 500 14px -apple-system,"Segoe UI",sans-serif; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="40" y="60" width="100" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="90" y="86" text-anchor="middle" fill="#444441">Takeoff</text>

<rect x="180" y="60" width="100" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="230" y="86" text-anchor="middle" fill="#0C447C">Search</text>

<rect x="320" y="60" width="100" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="370" y="86" text-anchor="middle" fill="#0C447C">Approach</text>

<rect x="460" y="60" width="100" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="510" y="86" text-anchor="middle" fill="#0C447C">Orbit</text>

<rect x="540" y="180" width="100" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="590" y="206" text-anchor="middle" fill="#085041">Hold (60 s)</text>

<rect x="320" y="180" width="100" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="370" y="206" text-anchor="middle" fill="#444441">Land</text>

<rect x="180" y="180" width="100" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="230" y="206" text-anchor="middle" fill="#444441">Done</text>

<line x1="140" y1="82" x2="180" y2="82" class="arr" marker-end="url(#arrow)"/>
<line x1="280" y1="82" x2="320" y2="82" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="82" x2="460" y2="82" class="arr" marker-end="url(#arrow)"/>

<path d="M 510 104 L 510 140 L 590 140 L 590 180" class="arr" marker-end="url(#arrow)"/>

<line x1="540" y1="202" x2="420" y2="202" class="arr" marker-end="url(#arrow)"/>

<line x1="320" y1="202" x2="280" y2="202" class="arr" marker-end="url(#arrow)"/>

<path d="M 230 60 L 230 40 L 370 40 L 370 60" stroke="#A32D2D" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
<text class="ts" x="230" y="32" fill="#791F1F">marker lost (from approach/orbit)</text>

<path d="M 230 104 L 230 140 L 370 140 L 370 180" stroke="#A32D2D" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="240" y="158" fill="#791F1F">no marker after full sweep → land</text>

<text class="ts" x="40" y="280">Solid arrows: nominal flow.</text>
<text class="ts" x="40" y="298">Dashed arrows: marker-loss recovery, or sweep-failure (give up and land).</text>
<text class="ts" x="40" y="316">Approach drives yaw_to_marker → 0 and distance → target.</text>
<text class="ts" x="40" y="334">Orbit slides the drone around the marker until heading → target.</text>
</svg>
