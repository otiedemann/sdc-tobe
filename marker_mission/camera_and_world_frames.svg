<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img">
<title>Camera and world coordinate frames</title>
<desc>Diagram showing the OpenCV camera frame axes and how the gimbal keeps the camera's x-z plane aligned with the world horizontal plane.</desc>
<style>
  .ts { font: 400 12px -apple-system,"Segoe UI",sans-serif; fill: #2C2C2A; }
  .th { font: 500 14px -apple-system,"Segoe UI",sans-serif; fill: #2C2C2A; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th" x="170" y="36" text-anchor="middle">Camera frame (OpenCV)</text>
<text class="th" x="510" y="36" text-anchor="middle">Gimbal alignment to world</text>

<!-- LEFT PANEL: camera frame axes from a common origin -->
<rect x="135" y="200" width="70" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="170" y="225" text-anchor="middle">Camera</text>

<line x1="205" y1="220" x2="290" y2="220" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="295" y="224" fill="#0C447C">+z forward</text>

<line x1="135" y1="220" x2="60" y2="220" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="55" y="224" text-anchor="end" fill="#085041">−x left</text>

<line x1="205" y1="240" x2="260" y2="280" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="265" y="288" fill="#085041">+x right (image right)</text>

<line x1="170" y1="200" x2="170" y2="120" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="178" y="135" fill="#712B13">−y up (image up)</text>

<line x1="170" y1="240" x2="170" y2="320" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="178" y="305" fill="#712B13">+y down (image down)</text>

<line x1="370" y1="60" x2="370" y2="400" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- RIGHT PANEL: gimbal keeps camera horizontal -->
<rect x="475" y="240" width="70" height="40" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="510" y="265" text-anchor="middle" fill="#0C447C">Camera</text>

<line x1="410" y1="295" x2="640" y2="295" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="ts" x="638" y="312" text-anchor="end">World horizontal plane</text>

<line x1="510" y1="240" x2="510" y2="120" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="518" y="135" fill="#0C447C">world up = −y_cam</text>

<line x1="475" y1="260" x2="410" y2="260" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="405" y="252" text-anchor="end" fill="#085041">+z_cam</text>
<text class="ts" x="405" y="266" text-anchor="end" fill="#085041">(horizontal)</text>

<line x1="545" y1="260" x2="610" y2="260" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="615" y="252" fill="#085041">+x_cam</text>
<text class="ts" x="615" y="266" fill="#085041">(horizontal)</text>

<text class="ts" x="510" y="358" text-anchor="middle">Drone roll and pitch are absorbed</text>
<text class="ts" x="510" y="374" text-anchor="middle">by the gimbal — the camera's</text>
<text class="ts" x="510" y="390" text-anchor="middle">x and z axes stay horizontal.</text>
</svg>
