# Sphinx Control configuration — copy to config.yaml and edit.
# Path is picked up via SPHINX_CONTROL_CONFIG env var, or auto-detected
# at sphinx-control/config.yaml if no env override is set.

# Where to bind the management web UI. 0.0.0.0 = listen on all interfaces
# (so Tailscale and LAN can reach it). Use 127.0.0.1 for localhost-only.
host: "0.0.0.0"
port: 8090

# Where the SQLite state DB lives. Persists across service restarts so
# spawned drones survive a reboot of the management service (the actual
# Sphinx processes do not — they're respawned on demand).
state_db: "./sphinx_control.db"

# Maximum simultaneous Sphinx instances on this host.
#
# Default 1 — Parrot Sphinx 2.x is architecturally one-drone-per-host:
# `firmwared` binds to fixed system paths (/tmp/fd_mount_points/...),
# the Gz↔UE4 bridge claims a single rendezvous, and the simulated
# drone always lives at 192.168.42.1 unless you isolate it inside a
# Linux network namespace. We've verified live on the SDC host that a
# second `sphinx` invocation collides with the first; the UI used to
# pretend ports-mode would handle this, it doesn't.
#
# To run more than one drone you need netns mode (CAP_NET_ADMIN +
# bridge) — the launcher supports it but it's a separate effort to
# wire up reliably. Until then, leave this at 1.
max_drones: 1

# How drones get distinct IPs. Two modes:
#   "ports"  — single IP (loopback by default), each drone on a unique
#              TCP port. Simplest, no root needed.
#   "netns"  — Linux network namespace per drone (each drone has its own
#              IP in `network.subnet`). Requires CAP_NET_ADMIN / sudo.
#              This is the "real virtual IP per drone" mode.
network:
  mode: "ports"
  # In ports mode, base port for the first drone. Drone N → port + N.
  base_port: 9080
  # Hostname/IP the management UI should display for ports-mode drones.
  # Defaults to the host's primary IP. Override here if you want the UI
  # to advertise a specific Tailscale or LAN address.
  bind_ip: null

  # netns-mode settings — only used when mode == "netns".
  # Each drone gets 10.202.0.<instance_id+10> by default.
  subnet: "10.202.0.0/24"
  bridge_name: "sphinx-br0"
  ip_offset: 10

# Where the parrot-ue4-* renderer should draw. The UE4 window must
# render into the user's *active* graphical session for the operator
# to see it directly, AND for desktop-streaming tools (Sunshine /
# Moonlight, RDP, VNC, NoMachine) to capture it. When sphinx-control
# runs as a systemd service the parent process has no DISPLAY /
# WAYLAND_DISPLAY / XAUTHORITY of its own, so we have to discover the
# active session via loginctl and splice its env vars into the UE4
# subprocess.
#
# Values:
#   "auto"            detect via `loginctl list-sessions` at startup
#                     (default — works on Ubuntu 22.04+ GNOME)
#   "off"             never inject session env (existing behavior)
#   "x11::0"          force X11, DISPLAY=:0
#   "wayland:wayland-0"  force Wayland, WAYLAND_DISPLAY=wayland-0
#
# Override per-run via env: SPHINX_CONTROL_SESSION_USER=foo
# (forces auto-detect to pick `foo`'s session if multiple users are
# logged in).
gnome_session_attach: "auto"

# Where to find the Sphinx CLI and stock drone descriptors. The
# defaults here match a vanilla `apt install parrot-sphinx` on Ubuntu.
sphinx:
  binary: "/usr/bin/sphinx"
  drone_descriptor_dir: "/opt/parrot-sphinx/usr/share/sphinx/drones"
  ue4_app_default: "parrot-ue4-empty"
  # Default firmware URL (used when a drone is spawned without an
  # explicit firmware override). The "%23latest" is URL-encoded "#latest"
  # which Sphinx accepts as "always pull the freshest build".
  # NOTE: the URL path uses "anafi" (not "anafi2") and the image is
  # "anafi-pc.ext2.zip" — this is what works on Sphinx 2.15.1 with
  # the anafi4k.drone descriptor. Verified manually:
  #   sphinx /opt/.../drones/anafi4k.drone::firmware="<this URL>"
  firmware_url: "https://firmware.parrot.com/Versions/anafi/pc/%23latest/images/anafi-pc.ext2.zip"

# Custom Unreal Engine apps available to the dashboard, in addition to
# stock parrot-ue4-* binaries discovered in PATH.
ue4_apps:
  - name: "empty"
    binary: "parrot-ue4-empty"
    description: "Stock minimal world. Cheap on GPU."
  - name: "factory"
    binary: "parrot-ue4-factory"
    description: "Stock truck-manufacturing facility."
  - name: "office"
    binary: "parrot-ue4-office"
    description: "Stock office reception + meeting rooms."
  # SDC arena scene built by tools/sphinx-arena/. Set this binary to
  # whatever your build emits, or leave it pointing at empty + the
  # arena.yml config_file below.
  - name: "sdc_arena"
    binary: "parrot-ue4-empty"
    config_file: "../tools/sphinx-arena/out/arena.yml"
    description: "SDC arena (markers injected via YAML config)."
  - name: "sdc_arena_test"
    binary: "parrot-ue4-sphx-tests"
    config_file: "../tools/sphinx-arena/out/arena.yml"
    description: "SDC arena on sphx-tests base world (richer surroundings)."

# UE4 runtime tuning.
ue4:
  # Initial drone pose, "x y z roll pitch yaw" (metres, radians) — space
  # separated to match Sphinx's <pose> XML element format. z=0.5 lifts
  # the drone above the raised arena floor (top at +0.40 m) so it
  # doesn't fall through on spawn.
  drone_spawn_pose: "0 0 0.5 0 0 0"

# Drone profiles available to the dashboard. The descriptor file under
# sphinx.drone_descriptor_dir must exist for the profile to be usable.
# Verified working with Sphinx 2.15.1 on the SDC fleet:
#   sphinx /opt/parrot-sphinx/usr/share/sphinx/drones/anafi4k.drone::firmware=...
drone_profiles:
  - name: "anafi"
    descriptor: "anafi4k.drone"
    description: "Anafi 4K (default fleet drone, Sphinx-verified)."
  - name: "anafi-usa"
    descriptor: "anafi_usa.drone"
    description: "Anafi USA / Thermal."
  - name: "anafi-ai"
    descriptor: "anafi_ai.drone"
    description: "Anafi Ai (newest, more compute-heavy)."

# ── Flight controller (unified_api_server.py) ──────────────────
# Optional: lets the dashboard launch the controller_unified service
# alongside the simulator. Same machine in the SDC sim setup, since
# the simulated Anafi appears at 192.168.42.1 just like a real one.
flight_controller:
  # Working dir for unified_api_server.py. The script runs from here
  # and reads its own arena_config.json / flight_config.json from CWD.
  cwd: "/home/sdc/sdc-tobe/controller_unified"
  # Python interpreter to use. Either an absolute path to a venv's
  # python, or a name on PATH (e.g. "python3"). The SDC fleet's
  # convention is a single repo-root venv at sdc-tobe/.venv that has
  # flask + olympe + everything else installed; point at it here so
  # the FC has its dependencies. Plain "python3" only works if those
  # deps are installed system-wide.
  python: "/home/sdc/sdc-tobe/.venv/bin/python"
  script: "unified_api_server.py"
  # HTTP port the FC binds. Surfaced in the dashboard so operators
  # can curl it. Set explicitly so it doesn't collide with sphinx-
  # control's own port.
  http_port: 8080
  # Anafi IP override. Leave null to inherit (defaults to 192.168.42.1
  # which works for both real Anafi and Sphinx-simulated Anafi). Set
  # if you've reconfigured the sim drone to a different IP (e.g.
  # 10.202.0.1 in netns mode).
  anafi_ip: null
  # Extra env vars to pass through to the FC process.
  extra_env: {}

# Set true to run the launcher in dry-run mode: no real Sphinx is
# started; instead each "drone" is a `sleep` placeholder so you can
# develop the UI on macOS or any host without parrot-sphinx installed.
# AUTO-ENABLED if /usr/bin/sphinx is missing.
dry_run: false

# Optional Tailscale awareness. When `enabled`, sphinx-control will
# call `tailscale status --json` to surface the host's tailnet IP and
# advertised routes in the dashboard. Read-only — sphinx-control never
# changes Tailscale config; it just reports it.
tailscale:
  enabled: true
  binary: "/usr/bin/tailscale"
