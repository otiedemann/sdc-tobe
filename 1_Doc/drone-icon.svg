<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <!-- Arms -->
    <line x1="60" y1="60" x2="22" y2="22" stroke="#444" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="60" x2="98" y2="22" stroke="#444" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="60" x2="22" y2="98" stroke="#444" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="60" x2="98" y2="98" stroke="#444" stroke-width="5" stroke-linecap="round"/>

    <!-- Propeller guards (dashed circles) -->
    <circle cx="22" cy="22" r="16" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="98" cy="22" r="16" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="22" cy="98" r="16" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="98" cy="98" r="16" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Rotor discs (spinning propellers) -->
    <ellipse cx="22" cy="22" rx="13" ry="4" fill="#aaa" opacity="0.85" transform="rotate(-45 22 22)"/>
    <ellipse cx="98" cy="22" rx="13" ry="4" fill="#aaa" opacity="0.85" transform="rotate(45 98 22)"/>
    <ellipse cx="22" cy="98" rx="13" ry="4" fill="#aaa" opacity="0.85" transform="rotate(45 22 98)"/>
    <ellipse cx="98" cy="98" rx="13" ry="4" fill="#aaa" opacity="0.85" transform="rotate(-45 98 98)"/>

    <!-- Motor hubs -->
    <circle cx="22" cy="22" r="5" fill="#e8a000" stroke="#BD7000" stroke-width="1"/>
    <circle cx="98" cy="22" r="5" fill="#e8a000" stroke="#BD7000" stroke-width="1"/>
    <circle cx="22" cy="98" r="5" fill="#e8a000" stroke="#BD7000" stroke-width="1"/>
    <circle cx="98" cy="98" r="5" fill="#e8a000" stroke="#BD7000" stroke-width="1"/>

    <!-- Central body -->
    <rect x="44" y="44" width="32" height="32" rx="5" fill="#333" stroke="#222" stroke-width="1.5"/>

    <!-- Camera lens -->
    <circle cx="60" cy="60" r="9" fill="#555" stroke="#333" stroke-width="1"/>
    <circle cx="60" cy="60" r="5" fill="#1a1a1a"/>
    <circle cx="57" cy="57" r="1.5" fill="white" opacity="0.5"/>
</svg>
